function typeIn(el,ms,done){if(RM){done&&done();return}
const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];let n;
while((n=w.nextNode()))if(n.nodeValue.trim())ns.push([n,n.nodeValue]);
ns.forEach(([n])=>{n.nodeValue=""});
const tot=ns.reduce((a,[,t])=>a+t.length,0),step=Math.max(2,Math.ceil(tot/(ms/16)));let i=0,k=0;
const tick=()=>{let q=step;while(q>0&&i<ns.length){const [n,t]=ns[i],take=Math.min(q,t.length-k);k+=take;q-=take;n.nodeValue=t.slice(0,k);if(k>=t.length){i++;k=0}}
if(i<ns.length)setTimeout(tick,16);else if(done)done()};tick()}
const tgc=k=>k==="High"?"High":k==="Watch"?"Moderate":"mut";

function terms(c){const m=c.m,r=[],P=(n,v,mn,l)=>r.push([n,v,mn,l]);
P("Revenue growth",c.nr?"Not meaningful":m.g+"% a year","How fast sales are rising compared with last year.",m.g>=10?1:m.g>=0?0:-1);
P("Net profit margin",c.nr?"Not meaningful":m.nm+"%","Profit left from every ₹100 of sales after all costs and tax.",m.nm>=12?1:m.nm>=5?0:-1);
if(c.ebm!=null)P("EBITDA margin",c.ebm+"%","Profit from core operations before interest, tax and wear-and-tear costs, per ₹100 of sales.",c.ebm>=20?1:c.ebm>=10?0:-1);
P("Return on equity (ROE)",m.roe==null?"Not meaningful":m.roe+"%","Profit earned on shareholders’ money. Higher means capital is used well.",m.roe==null?-1:m.roe>=15?1:m.roe>=8?0:-1);
if(c.roce!=null)P("Return on capital employed (ROCE)",c.roce+"%","Profit earned on all money in the business, both equity and debt.",c.roce>=15?1:c.roce>=10?0:-1);
if(m.de!=null)P("Debt to equity",m.de<0?"Negative net worth":m.de+" times","Borrowings compared with shareholders’ money. Lower is safer.",m.de<0?-1:m.de<.5?1:m.de<1.5?0:-1);
if(m.ic!=null)P("Interest cover",m.ic>50?"Above 50 times":m.ic+" times","How many times operating profit pays the interest bill. Below 3 is thin.",m.ic>=6?1:m.ic>=3?0:-1);
if(c.cr!=null)P("Current ratio",c.cr,"Short-term assets compared with bills due within a year. Below 1 is a liquidity risk.",c.cr>=1.5?1:c.cr>=1?0:-1);
if(c.ocf)P("Cash check",c.ocf,"Does the cash match the profit? Real cash should roughly follow reported profit.",-1);
(c.bx||[]).forEach(x=>P(...x));
P("Promoter holding",m.pr?m.pr+"%":"No promoter group","Share owned by the founding group. Higher usually means committed owners.",null);
P("Promoter pledge",m.pr?m.pl+"%":"Not applicable","Promoter shares pledged for loans. Lenders can sell them if the price falls.",m.pr?(m.pl===0?1:m.pl<20?0:-1):null);
[["P/E ratio","Price divided by yearly profit per share. Shows how expensive the stock is compared with its earnings."],["P/B ratio","Price divided by book value per share. Useful for banks and asset-heavy firms."],["EPS","Profit earned per share."],["Market cap","Share price times number of shares: the company’s total market value."],["Dividend yield","Yearly dividend as a percentage of the share price."]].forEach(([n,d])=>P(n,"Needs live price",d,null));
return r}
function flags(c){const m=c.m,RD=[],GR=[],a=(x,t,w)=>x.push([t,w]);
(c.fx||[]).forEach(([t,w])=>a(RD,t,w));
if(m.nm<0)a(RD,"Company is making a net loss","It spends more than it earns, so it must borrow or raise money to survive.");else if(m.nm>=15)a(GR,"Strong profit margin","It keeps a large share of every sale as profit.");
if(m.de!=null){if(m.de<0)a(RD,"Negative net worth","Liabilities exceed assets, leaving little for shareholders if things go wrong.");else if(m.de>=1.5)a(RD,"Heavy debt","Large repayments can strain cash in a weak year.");else if(m.de<.5)a(GR,"Low debt","Little pressure from lenders, so it can handle a bad year.")}
if(m.ic!=null){if(m.ic<1.5)a(RD,"Interest is barely covered","Profit may not be enough to pay lenders.");else if(m.ic>=6)a(GR,"Interest is paid easily","Operating profit is many times the interest bill.")}
if(m.pl>=5)a(RD,m.pl+"% of promoter shares pledged","A price fall can force lenders to sell, pushing the price down further.");else if(m.pr&&m.pl===0)a(GR,"No promoter shares pledged","Owners are not using their shares to borrow.");
if(m.g<0)a(RD,"Revenue is falling","Shrinking sales make it harder to grow profit.");else if(m.g>=10)a(GR,"Revenue is growing fast","Rising sales give room for profit growth.");
if(m.roe!=null){if(m.roe<8)a(RD,"Low return on equity","The business earns little on shareholders’ money.");else if(m.roe>=15)a(GR,"High return on equity","The company turns shareholders’ money into profit efficiently.")}
if(c.cr!=null){if(c.cr<1)a(RD,"Short-term bills exceed short-term assets","It may need to borrow to pay near-term bills.");else if(c.cr>=1.5)a(GR,"Comfortable short-term cash position","It can pay near-term bills from near-term assets.")}
(c.bx||[]).forEach(x=>{if(x[3]===1)a(GR,x[0]+": "+x[1],x[2])});
if(c.fraud)GR.length=0;
c.ind.concat(c.co).forEach(([s,h,w])=>a(s>0?GR:RD,h,w));

${c.fraud?`<div class="fraud"><b>${c.fl||"Confirmed fraud (historical case)."}</b> ${c.fb} ${f.red.length} red flags found.</div>`:""}<h4>Industry news</h4>${nl(c.ind)}

<p class="mut sm" style="margin:8px 0 0">${c.fic?"Fictional demo scenario. Not a real company.":c.fraud?"These are real past events.":"Sample headlines for the demo. A live news feed plugs in here."}</p>

return `<div class="big ${v[1]}">${v[0]} <span class="mut sm">scam score ${s} out of 100</span></div>
